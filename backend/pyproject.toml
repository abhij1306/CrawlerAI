[build-system]
requires = ["setuptools>=84,<85", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlerai-backend"
version = "0.1.0"
description = "CrawlerAI POC backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.30.0,<1",
  "cachetools>=5.5.2,<8",
  "celery[redis]>=5.4.0,<6",
  "curl-cffi>=0.14.0,<1",
  "cryptography>=50.0.0,<51",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116.0,<1",
  "starlette>=1.3.1,<2",
  "fastmcp-slim>=3.2.0,<4",
  "email-validator>=2.3.0,<3",
  "httpx[socks]>=0.28.1,<1",
  "joserfc>=1.6.8,<2",
  "logfire[celery,fastapi,system-metrics]>=4.0.0,<5",
  "passlib[bcrypt]>=1.7.4,<2",
  "patchright>=1.58.2,<2",
  "prometheus-client>=0.23.1,<1",
  "pydantic-settings>=2.10.0,<3",
  "python-multipart>=0.0.30,<1",
  "redis>=6.4.0,<9",
  "selectolax>=0.4.7,<1",
  "sqlalchemy>=2.0.43,<3",
  "structlog>=25.4.0,<27",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.optional-dependencies]
# Local/dev environments can use psycopg2-binary to avoid libpq toolchain setup.
# Production should install psycopg2 explicitly (not listed in core dependencies to avoid conflicts).
dev = [
  "hypothesis>=6.0.0,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "psycopg2-binary>=2.9.10,<3",
  "ruff>=0.1.0,<1",
  "mypy>=1.20.1,<3",
  "types-cachetools>=6.2.0.20260408,<8",
  "types-passlib>=1.7.7.20260211,<2",
  "pylint>=4.0.5,<5",
  "basedpyright>=1.39.2,<2",
  "bandit>=1.9.4,<2",
  "vulture>=2.16,<3",
  "radon>=6.0.1,<7",
]
prod = [
  "psycopg2>=2.9.10,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
# Freeze Ruff's historical default surface. Ruff 0.16 expanded implicit rules;
# broader lint-policy changes belong in an explicit quality-gate plan.
select = ["E4", "E7", "E9", "F"]

[tool.pylint.main]
ignore-paths = [
  "^tests/.*$",
  "^alembic/.*$",
]

[tool.pylint.messages_control]
disable = [
  "import-error",
  "no-name-in-module",
  "line-too-long",
  "missing-module-docstring",
  "missing-class-docstring",
  "fixme",
  # Legacy architecture/style patterns accepted by existing tests and facades.
  "broad-exception-caught",
  "import-outside-toplevel",
  "invalid-name",
  "protected-access",
  "redefined-outer-name",
  "too-few-public-methods",
  "too-many-public-methods",
  "unused-wildcard-import",
  "wildcard-import",
  # Legacy full-app baseline. Keep pylint useful for new fatal syntax/import drift
  # without forcing unrelated architecture/docstring rewrites in this slice.
  "chained-comparison",
  "cyclic-import",
  "dangerous-default-value",
  "duplicate-code",
  "global-statement",
  "missing-function-docstring",
  "not-callable",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-locals",
  "too-many-return-statements",
  "try-except-raise",
  "unsubscriptable-object",
  "wrong-import-order",
  "consider-using-from-import",
  "mixed-line-endings",
  "no-else-return",
  "no-member",
  "superfluous-parens",
  "too-many-boolean-expressions",
  "too-many-lines",
  "too-many-positional-arguments",
  "too-many-statements",
  "ungrouped-imports",
  "unidiomatic-typecheck",
  "unnecessary-comprehension",
  "unnecessary-lambda",
  "unused-argument",
  "use-maxsplit-arg",
  "use-sequence-for-iteration",
  "useless-import-alias",
]

[tool.pylint.design]
max-args = 8
max-branches = 12
max-locals = 15
max-returns = 8
max-statements = 50
max-attributes = 12
max-public-methods = 24
max-module-lines = 1000

[tool.pylint.similarities]
min-similarity-lines = 5

[tool.vulture]
min_confidence = 100

[tool.mypy]
python_version = "3.12"
exclude = ["tests", "alembic", "\\.venv"]

[[tool.mypy.overrides]]
module = [
  "celery",
  "celery.*",
  "defusedxml",
]
ignore_missing_imports = true
