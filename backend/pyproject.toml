[build-system]
requires = ["setuptools>=84,<85", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlerai-backend"
version = "0.1.0"
description = "CrawlerAI POC backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.30.0,<1",
  "cachetools>=5.5.2,<8",
  "celery[redis]>=5.4.0,<6",
  "curl-cffi>=0.14.0,<1",
  "cryptography>=50.0.0,<51",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116.0,<1",
  "starlette>=1.3.1,<2",
  "fastmcp-slim[server]>=3.2.0,<4",
  "email-validator>=2.3.0,<3",
  "httpx[socks]>=0.28.1,<1",
  "joserfc>=1.6.8,<2",
  "logfire[celery,fastapi,system-metrics]>=4.0.0,<5",
  "opentelemetry-api>=1.44.0,<2",
  "patchright>=1.58.2,<2",
  "prometheus-client>=0.23.1,<1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.10.0,<3",
  "python-multipart>=0.0.30,<1",
  "redis>=6.4.0,<9",
  "selectolax>=0.4.7,<1",
  "sqlalchemy>=2.0.43,<3",
  "structlog>=25.4.0,<27",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.0.0,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.1.0,<1",
  "mypy>=1.20.1,<3",
  "types-cachetools>=6.2.0.20260408,<8",
  "pip-audit>=2.10.1,<3",
  "basedpyright>=1.39.2,<2",
  "bandit>=1.9.4,<2",
  "vulture>=2.16,<3",
  "radon>=6.0.1,<7",
  "deptry>=0.20,<1",
  "import-linter>=2.0,<3",
  "pytest-cov>=7.0,<8",
]
prod = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "ASYNC", "BLE", "RUF"]
ignore = [
  "S105",
  "S106",
  "S107",
  "RUF001",
  "RUF002",
  "RUF003",
  # Protocol and third-party callback signatures require this parameter name.
  "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ASYNC240", "RUF012"]

[tool.vulture]
min_confidence = 100
ignore_names = ["deep", "__context"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = false
skip_covered = true

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = ["alembic", "tests"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "alembic",
  "asyncpg",
  "email-validator",
  "python-multipart",
  # Loaded deliberately through importlib so metrics remain optional at runtime.
  "prometheus-client",
  "uvicorn",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "bootstrap_admin.py", "ecr_scan_gate.py", "run_extraction_smoke.py"]
exclude = ["tests", "alembic", "\\.venv"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "celery",
  "celery.*",
  "defusedxml",
]
ignore_missing_imports = true
