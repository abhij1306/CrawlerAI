name: Frontend Playwright Smoke

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/frontend-playwright-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crawlerai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crawlerai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-jwt-secret-key-change-me-32-bytes
      ENCRYPTION_KEY: ci-encryption-key-change-me-32b
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/crawlerai
      REDIS_STATE_ENABLED: false
      CELERY_DISPATCH_ENABLED: false
      BOOTSTRAP_ADMIN_ONCE: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: vp install

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: vp pm audit -- --audit-level=high

      - name: Frontend lint, types, and architecture policy
        working-directory: frontend
        run: |
          vp check
          node scripts/check-token-escapes.mjs
          node scripts/check-crawl-architecture.mjs
          node scripts/check-frontend-architecture.mjs

      - name: Frontend unit tests
        working-directory: frontend
        run: vp test

      - name: Build frontend and check bundle budgets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8001
        run: |
          vp build
          node scripts/check-bundle-budgets.mjs --require-dist

      - name: Install Playwright browser
        working-directory: frontend
        run: vp exec playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply backend migrations
        working-directory: backend
        run: |
          uv run python -c "from app.core.migrations import apply_pending_migrations; apply_pending_migrations()"

      - name: Start backend API server
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &

      - name: Wait for backend healthcheck
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:8001/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          cat /tmp/backend.log || true
          exit 1

      - name: Start frontend dev server
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8001
        run: |
          nohup vp dev > /tmp/frontend.log 2>&1 &

      - name: Wait for frontend root URL
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3001/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time"
          cat /tmp/frontend.log || true
          exit 1

      - name: Run Playwright smoke suite
        working-directory: frontend
        env:
          CI: true
          VITE_API_BASE_URL: http://127.0.0.1:8001
        run: vp exec playwright test --config playwright.config.ts smoke.spec.ts
