services:
  # NOTE: DB credentials default to dev values. Production/staging must supply
  # secure overrides via environment, .env, or docker-compose.override.yml / CI secrets.
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crawlerai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crawlerai}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment: &backend_env
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-crawlerai}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/1
      REDIS_STATE_ENABLED: "true"
      CELERY_DISPATCH_ENABLED: "true"
      SCHEDULER_DRIVER: "celery"
      PLAYWRIGHT_HEADLESS: "true"
      FRONTEND_URL: http://127.0.0.1:3001
      FRONTEND_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
      CRAWLER_RUNTIME_BROWSER_REAL_CHROME_ENABLED: "false"
      BOOTSTRAP_ADMIN_ONCE: "false"
    depends_on:
      db:
        condition: service_healthy
    command: [".venv/bin/python", "init_db.py"]

  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *backend_env
      BOOTSTRAP_ADMIN_ONCE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [".venv/bin/python", "bootstrap_admin.py"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend_env
      BOOTSTRAP_ADMIN_ONCE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - backend_artifacts:/app/backend/artifacts
      - backend_cookie_store:/app/backend/cookie_store
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend_env
      BOOTSTRAP_ADMIN_ONCE: "false"
      BROWSER_POOL_SIZE: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        ".venv/bin/celery",
        "-A",
        "app.core.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=solo",
        "--concurrency=1",
        "--hostname=worker@%h"
      ]
    volumes:
      - backend_artifacts:/app/backend/artifacts
      - backend_cookie_store:/app/backend/cookie_store
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/celery -A app.core.celery_app.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend_env
      BOOTSTRAP_ADMIN_ONCE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        ".venv/bin/celery",
        "-A",
        "app.core.celery_app.celery_app",
        "beat",
        "--loglevel=INFO"
      ]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
  redis_data:
  backend_artifacts:
  backend_cookie_store:
