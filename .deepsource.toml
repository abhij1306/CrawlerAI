version = 1

exclude_patterns = [
  ".codacy/**",
  ".qodo/**",
  ".scannerwork/**",
  ".venv/**",
  "backend/.venv/**",
  "backend/alembic/**",
  "backend/artifacts/**",
  "backend/htmlcov/**",
  "backend/.mypy_cache/**",
  "backend/.pytest_cache/**",
  "frontend/.next/**",
  "frontend/coverage/**",
  "frontend/node_modules/**",
  "frontend/playwright-report/**",
  "frontend/test-results/**",
]

test_patterns = [
  "backend/tests/**",
  "frontend/**/*.test.ts",
  "frontend/**/*.test.tsx",
  "frontend/tests/**",
]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"
  cyclomatic_complexity_threshold = "critical"

[[analyzers]]
name = "javascript"
enabled = true
dependency_file_paths = ["frontend"]

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser", "vitest"]
  module_system = "es-modules"
  dialect = "typescript"
  cyclomatic_complexity_threshold = "critical"

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "sql"
enabled = true

[[analyzers]]
name = "java"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
